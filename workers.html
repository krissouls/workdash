<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkDash | For Workers</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">
            <div class="logo">
                <a href="#">
                   <img src="logo.png" alt="Workdash Logo" class="logo-img">
                </a>
                <span>WorkDash</span>
            </div>

            <!-- Hamburger -->
            <div class="menu-toggle" onclick="toggleMenu()">☰</div>

            <nav id="nav-links">
                <a href="index.html">Home</a>
                <a href="business.html">Business</a>
                <a href="workers.html">Workers</a>
                <a href="contact.html">Contact</a>
            </nav>

            <button class="nav-btn">Get Started</button>
    </header>

    <div style="max-width:600px;margin:auto;padding:16px;font-family:Arial;">

  <h2>Find Jobs Near You</h2>
  <p>Apply instantly and get selected fast.</p>

  <input 
    type="text" 
    placeholder="Search jobs (warehouse, events, etc)" 
    style="width:100%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #ccc;"
  />

  <button onclick="viewApplications()" 
style="padding:10px;margin:10px 0;width:100%;background:#eee;border:none;">
  View My Applications
</button>

  <div class="job-card" style="border:1px solid #eee;padding:12px;margin:10px 0;border-radius:10px;">
    <h3>Warehouse Helper</h3>
    <p>📍 Andheri East • 💰 ₹700/day</p>
    <p>⏰ 9AM - 6PM</p>
    <button onclick="openForm('Warehouse Helper')" 
    style="padding:10px 15px;background:black;color:white;border:none;border-radius:8px;">
    Apply Now
    </button>
  </div>

  <div class="job-card" style="border:1px solid #eee;padding:12px;margin:10px 0;border-radius:10px;">
    <h3>Event Staff</h3>
    <p>📍 BKC • 💰 ₹900/day</p>
    <p>⏰ 5PM - 11PM</p>
    <button onclick="openForm('Warehouse Helper')" 
     style="padding:10px 15px;background:black;color:white;border:none;border-radius:8px;">
     Apply Now
    </button>
  </div>

</div>

<div id="applyModal" 
style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.5);justify-content:center;align-items:center;">

  <div style="background:white;padding:20px;border-radius:10px;width:90%;max-width:400px;">
    
    <h3 id="jobTitle">Apply</h3>

    <input id="name" placeholder="Your Name" style="width:100%;padding:10px;margin:5px 0;">
    <input id="phone" placeholder="Phone Number" style="width:100%;padding:10px;margin:5px 0;">

    <button onclick="submitApplication()" 
    style="width:100%;padding:10px;background:black;color:white;border:none;margin-top:10px;">
      Submit
    </button>

    <button onclick="closeForm()" style="width:100%;padding:10px;margin-top:5px;">
      Cancel
    </button>

  </div>
</div>

    <!-- Script -->
    <script src="script.js"></script>

</body>
</html>
